name: solar
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  # geospatial (GDAL/rasterio from conda-forge, never pip)
  - gdal
  - rasterio
  - geopandas
  - pyogrio
  # data + ML
  - pandas
  - numpy
  - scipy
  - requests
  - scikit-learn
  - xgboost
  - shap
  - pvlib
  - matplotlib
  - seaborn
  - jupyterlab
  # database
  - sqlalchemy
  - geoalchemy2
  - psycopg2
  # services
  - fastapi
  - uvicorn
  - python-dotenv
  # tests
  - pytest
