<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SESAS — Solar Equity Gap, Maryland</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --ink:#15202b; --ink-mid:#4a5968; --ink-soft:#7a8795;
    --line:#dde3ea; --panel:#ffffff; --ground:#f4f6f9;
    --hi:#b2182b; --mid:#ef8a62; --neutral:#f7f7f7; --lo:#67a9cf; --lolo:#2166ac;
    --accent:#c1440e;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:var(--font);color:var(--ink);background:var(--ground);display:flex;flex-direction:column}

  header{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 18px;
         display:flex;align-items:center;gap:22px;flex-wrap:wrap;z-index:1000}
  h1{font-size:15px;font-weight:650;margin:0;letter-spacing:-.01em;white-space:nowrap}
  h1 span{color:var(--ink-soft);font-weight:400}
  select{font-family:var(--font);font-size:13px;padding:5px 9px;border:1px solid var(--line);
         border-radius:5px;background:#fff;color:var(--ink);min-width:190px}
  label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);
        margin-right:7px;font-weight:600}
  #search{display:flex;align-items:center;gap:0}
  #addr{font-family:var(--font);font-size:13px;padding:5px 9px;border:1px solid var(--line);
        border-radius:5px 0 0 5px;width:236px;color:var(--ink)}
  #addr:focus{outline:2px solid var(--accent);outline-offset:-1px}
  #search button{font-family:var(--font);font-size:12px;font-weight:600;padding:6px 12px;
    border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;
    border-radius:0 5px 5px 0}
  #search button:disabled{opacity:.55;cursor:default}
  #search{position:relative}
  #addr{width:330px}
  #suggest{position:absolute;top:100%;left:0;right:0;margin:4px 0 0;padding:4px 0;list-style:none;
           background:#fff;border:1px solid var(--line);border-radius:7px;z-index:2000;
           box-shadow:0 6px 20px rgba(21,32,43,.14);max-height:340px;overflow-y:auto}
  #suggest[hidden]{display:none}
  #suggest li{padding:8px 12px;font-size:13px;line-height:1.35;cursor:pointer;color:var(--ink)}
  #suggest li small{display:block;font-size:11px;color:var(--ink-soft)}
  #suggest li[aria-selected="true"],#suggest li:hover{background:#fdf1ea}
  #suggest li.msg{cursor:default;color:var(--ink-soft);font-size:12px}
  #suggest li.msg:hover{background:none}
  .pin{filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
  .addr-card{background:#fffbea;border:1px solid #f2dc8b;border-radius:6px;padding:9px 11px;
             margin-bottom:14px;font-size:12px;line-height:1.45}
  .addr-card b{display:block;font-size:13px;margin-bottom:2px}
  #tiers{display:flex;gap:7px;margin-left:auto;flex-wrap:wrap}
  .chip{font-size:11px;font-family:var(--mono);padding:4px 9px;border-radius:11px;
        border:1px solid var(--line);background:#fff;white-space:nowrap}
  .chip b{font-weight:650}
  .chip.HIGH{background:#fdecea;border-color:#f3c0b9;color:var(--hi)}
  .chip.MEDIUM{background:#fef4ec;border-color:#f6d9c2;color:#9a4f12}
  .chip.LOW{background:#eef4fa;border-color:#cfe0ef;color:#2166ac}

  main{flex:1;display:flex;min-height:0}
  #map{flex:1;min-width:0;background:var(--ground)}
  aside{width:312px;flex:none;background:var(--panel);border-left:1px solid var(--line);
        overflow-y:auto;padding:16px 18px}

  .empty{color:var(--ink-soft);font-size:13px;line-height:1.55;margin-top:6px}
  .geoid{font-family:var(--mono);font-size:12px;color:var(--ink-soft);margin:0 0 3px}
  .tier{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;
        padding:3px 9px;border-radius:4px;margin-bottom:14px}
  .tier.HIGH{background:#fdecea;color:var(--hi)}
  .tier.MEDIUM{background:#fef4ec;color:#9a4f12}
  .tier.LOW{background:#eef4fa;color:#2166ac}
  .tier.NONE{background:#f0f2f5;color:var(--ink-soft)}

  .pair{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
        padding:9px 0;border-bottom:1px solid var(--line)}
  .pair:last-child{border-bottom:0}
  .pair dt{font-size:12px;color:var(--ink-mid)}
  .pair dd{margin:0;font-family:var(--mono);font-size:13px;font-weight:600;
           font-variant-numeric:tabular-nums}
  dl{margin:0}
  .big{font-size:26px;font-weight:650;font-family:var(--mono);line-height:1.1;
       font-variant-numeric:tabular-nums}
  .big.pos{color:var(--hi)} .big.neg{color:var(--lolo)}
  .sub{font-size:11px;color:var(--ink-soft);margin-top:3px;line-height:1.45}
  h2{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-soft);
     margin:20px 0 7px;font-weight:650}
  .note{font-size:11px;color:var(--ink-soft);line-height:1.5;margin-top:14px;
        padding-top:12px;border-top:1px solid var(--line)}

  .legend{background:#fff;padding:9px 11px;border-radius:6px;border:1px solid var(--line);
          font-size:11px;line-height:1.7;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .legend i{width:15px;height:11px;float:left;margin:3px 7px 0 0;border-radius:2px}
  .legend .t{font-weight:650;margin-bottom:5px;font-size:10px;text-transform:uppercase;
             letter-spacing:.05em;color:var(--ink-soft)}
  .leaflet-container{font-family:var(--font)}
  #status{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:900;
          background:#fff;border:1px solid var(--line);border-radius:7px;padding:14px 20px;
          font-size:13px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
  #status.err{border-color:#f3c0b9;background:#fdecea;color:var(--hi);max-width:420px}
</style>
</head>
<body>

<header>
  <h1>Solar Equity Gap <span>· Maryland</span></h1>
  <div><label for="county">County</label><select id="county"></select></div>
  <form id="search" role="search"><label for="addr">Address</label><input id="addr" type="text"
    placeholder="Start typing a Maryland address…" autocomplete="off" spellcheck="false"
    role="combobox" aria-autocomplete="list" aria-controls="suggest" aria-expanded="false"><button>Find</button>
    <ul id="suggest" role="listbox" hidden></ul></form>
  <div id="tiers"></div>
</header>

<main>
  <div id="map"><div id="status">Loading tracts…</div></div>
  <aside>
    <div id="panel">
      <h2>Tract detail</h2>
      <p class="empty">Click any tract to see its expected versus actual adoption and the
         structural factor driving its gap.</p>
    </div>
  </aside>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const COUNTIES = {
  "":"All Maryland","24001":"Allegany","24003":"Anne Arundel","24005":"Baltimore County",
  "24009":"Calvert","24011":"Caroline","24013":"Carroll","24015":"Cecil","24017":"Charles",
  "24019":"Dorchester","24021":"Frederick","24023":"Garrett","24025":"Harford","24027":"Howard",
  "24029":"Kent","24031":"Montgomery","24033":"Prince George's","24035":"Queen Anne's",
  "24037":"St. Mary's","24039":"Somerset","24041":"Talbot","24043":"Washington",
  "24045":"Wicomico","24047":"Worcester","24510":"Baltimore City"
};

const LABELS = {
  pct_minority:"Minority share", median_household_income:"Median income",
  median_home_value:"Median home value", single_family_detached_rate:"Detached homes",
  owner_rate:"Owner-occupancy", pop_density_km2:"Population density",
  low_income_share:"Low-income share", energy_burden:"Energy burden",
  poverty_rate:"Poverty rate", renter_share:"Renter share", median_year_built:"Housing vintage"
};

// Colour by priority tier, not by raw gap. Tiers come from the statewide gap percentile, so
// a tract can sit in the HIGH tier on a gap of +2.25 - which on a raw-gap scale spanning
// -19 to +10 renders as the palest possible fill. Keying the map to the tier keeps the
// fill, the legend and the detail badge all saying the same thing.
const TIER_COLORS = {HIGH:"#b2182b", MEDIUM:"#ef8a62", LOW:"#4393c3"};
const colorFor = t => TIER_COLORS[t] || "#d9dee4";

const map = L.map("map", {zoomControl:true}).setView([39.03, -76.8], 8);
// Plain OSM tiles: CARTO's basemaps started demanding an API key, and a course project
// should not carry a credential just to draw a background.
const streets = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution:'&copy; OpenStreetMap contributors', maxZoom:19, opacity:0.55
}).addTo(map);
// Satellite, so a searched rooftop is visible as a roof. Esri's imagery needs no key.
const satellite = L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
  attribution:"Imagery &copy; Esri, Maxar, Earthstar Geographics", maxZoom:19});
L.control.layers({"Street map": streets, "Satellite": satellite}, null, {position:"topleft"}).addTo(map);

// Zoomed in to a street, tract colour would hide the buildings, so it fades to a tint.
const CLOSE_ZOOM = 16;
map.on("zoomend", () => { if (layer) layer.setStyle(f => style(f)); if (selected) highlight(selected); });

const legend = L.control({position:"bottomright"});
legend.onAdd = () => {
  const d = L.DomUtil.create("div","legend");
  const rows = [
    ["#b2182b","High — top quartile gap"],
    ["#ef8a62","Medium"],
    ["#4393c3","Low — at or above expectation"],
    ["#d9dee4","Not scored"]
  ];
  d.innerHTML = '<div class="t">Intervention priority</div>' +
    rows.map(([c,t]) => `<i style="background:${c}"></i>${t}<br>`).join("");
  return d;
};
legend.addTo(map);

const sel = document.getElementById("county");
Object.entries(COUNTIES).forEach(([v,n]) => sel.add(new Option(n, v)));
sel.value = "24510";

let layer = null, selected = null;

const fmt = (v, d=2) => v == null ? "—" : Number(v).toFixed(d);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const highlight = l => l.setStyle({weight:2.5, color:"#15202b"});

function setStatus(msg, isErr) {
  const old = document.getElementById("status");
  if (old) old.remove();
  if (!msg) return;
  const el = document.createElement("div");
  el.id = "status"; el.textContent = msg;
  if (isErr) el.className = "err";
  document.getElementById("map").appendChild(el);
}

function renderTiers(features) {
  const counts = {HIGH:0, MEDIUM:0, LOW:0};
  features.forEach(f => { const t = f.properties.priority_tier; if (t in counts) counts[t]++; });
  document.getElementById("tiers").innerHTML = Object.entries(counts)
    .map(([t,n]) => `<span class="chip ${t}">${t} <b>${n}</b></span>`).join("")
    + `<span class="chip">${features.length} tracts</span>`;
}

// Only factors with a positive SHAP are stored, so anything present here widens the gap.
function factorRows(p) {
  const rows = [1,2,3]
    .map(i => [p[`barrier_${i}`], p[`barrier_${i}_shap`]])
    .filter(([n, v]) => n && v != null)
    .map(([n, v]) => `<div class="pair"><dt>${LABELS[n] || n}</dt><dd>+${fmt(v)}</dd></div>`);
  return rows.length ? rows.join("")
    : `<div class="pair"><dt>No factor widens this gap</dt><dd>—</dd></div>`;
}

function renderPanel(p) {
  const tier = p.priority_tier || "NONE";
  const gap = p.gap;
  document.getElementById("panel").innerHTML = `
    <h2>Tract detail</h2>
    <p class="geoid">${p.geoid}</p>
    <span class="tier ${tier}">${tier === "NONE" ? "NOT SCORED" : tier + " PRIORITY"}</span>
    <div class="big ${gap > 0 ? "pos" : "neg"}">${gap == null ? "—" : (gap > 0 ? "+" : "") + fmt(gap)}</div>
    <div class="sub">gap in residential systems per 1,000 households${
      gap > 0 ? " — fewer than its sunlight supports" : gap < 0 ? " — more than expected" : ""}</div>
    <h2>Components</h2>
    <dl>
      <div class="pair"><dt>Expected adoption</dt><dd>${fmt(p.expected_adoption)}</dd></div>
      <div class="pair"><dt>Actual adoption</dt><dd>${fmt(p.actual_adoption)}</dd></div>
      <div class="pair"><dt>Gap percentile</dt><dd>${p.gap_percentile == null ? "—" :
        (p.gap_percentile*100).toFixed(0) + "%"}</dd></div>
    </dl>
    <h2>What widens this gap</h2>
    <dl>${factorRows(p)}</dl>
    <div class="sub" style="margin-top:6px">SHAP contributions, largest first. These
      factors are collinear — income, poverty and minority share move together — so three
      are listed rather than one.</div>
    <p class="note">Expected and actual are both shown because the gap alone cannot
       distinguish real untapped potential from a poor expectation. Adoption is DeepSolar's
       2016 baseline.</p>`;
}

function style(f) {
  const close = map.getZoom() >= CLOSE_ZOOM;
  return {fillColor: colorFor(f.properties.priority_tier), weight: close ? 1.5 : 0.5,
          color: close ? colorFor(f.properties.priority_tier) : "#ffffff",
          fillOpacity: close ? 0.12 : 0.72, opacity: 1};
}

async function load() {
  setStatus("Loading tracts…");
  if (layer) { map.removeLayer(layer); layer = null; }
  const q = sel.value ? `?county=${sel.value}` : "";
  try {
    const r = await fetch(`../geojson/equity${q}`);
    if (!r.ok) throw new Error(`${r.status} ${(await r.json()).detail || r.statusText}`);
    const gj = await r.json();
    if (!gj.features.length) { setStatus("No scored tracts here.", true); return; }

    layer = L.geoJSON(gj, {
      style,
      onEachFeature: (f, lyr) => {
        lyr.bindTooltip(`${f.properties.geoid}<br>gap ${fmt(f.properties.gap)}`, {sticky:true});
        lyr.on({
          mouseover: e => e.target.setStyle({weight:2, color:"#15202b"}),
          mouseout:  e => { if (e.target !== selected) layer.resetStyle(e.target); },
          click: e => {
            if (selected) layer.resetStyle(selected);
            selected = e.target;
            highlight(e.target);
            renderPanel(f.properties);
          }
        });
      }
    }).addTo(map);

    // The map lives in a flex column, so Leaflet can still be holding a stale container
    // size when this fetch resolves. Without the re-measure, fitBounds reads a near-zero
    // height, snaps to max zoom, and every polygon renders as the degenerate path "M0 0".
    map.invalidateSize();
    map.fitBounds(layer.getBounds(), {padding:[18,18], animate:false});
    renderTiers(gj.features);
    setStatus(null);
  } catch (e) {
    setStatus(`Could not load tracts: ${e.message}. Is EquityGapService running on 8005?`, true);
    document.getElementById("tiers").innerHTML = "";
  }
}

sel.addEventListener("change", load);

// Address search. Typing asks /suggest (OpenStreetMap via Photon: typo-tolerant, Maryland
// only); picking a suggestion sends its coordinates to /lookup, which finds the 2020 tract
// through the Census geocoder and scores it. If nothing is picked, Enter falls back to the
// Census exact-address match, which is what the search did before suggestions existed.
const form = document.getElementById("search");
const addr = document.getElementById("addr");
const list = document.getElementById("suggest");
let suggestions = [], active = -1, debounce = null, inflight = null;
let pin = null, roof = null;

function flashPanel(html) {
  document.getElementById("panel").innerHTML = `<h2>Tract detail</h2>${html}`;
}

function showList(items, message) {
  suggestions = items; active = -1;
  list.innerHTML = message ? `<li class="msg">${esc(message)}</li>` : items.map((x, i) => {
    const [first, ...rest] = x.label.split(", ");
    return `<li role="option" id="opt-${i}" data-i="${i}"><span>${esc(first)}</span><small>${esc(rest.join(", "))}</small></li>`;
  }).join("");
  list.hidden = !message && !items.length;
  addr.setAttribute("aria-expanded", String(!list.hidden));
}
const hideList = () => { list.hidden = true; addr.setAttribute("aria-expanded", "false"); };

function setActive(i) {
  const opts = list.querySelectorAll("li[role=option]");
  if (!opts.length) return;
  active = (i + opts.length) % opts.length;
  opts.forEach((o, j) => o.setAttribute("aria-selected", String(j === active)));
  opts[active].scrollIntoView({block:"nearest"});
  addr.setAttribute("aria-activedescendant", `opt-${active}`);
}

addr.addEventListener("input", () => {
  clearTimeout(debounce);
  const q = addr.value.trim();
  if (q.length < 3) { hideList(); return; }
  // Debounced, and each request cancels the last, so a fast typist never sees results for
  // an older prefix land on top of newer ones - and the public geocoder is not hammered.
  debounce = setTimeout(async () => {
    if (inflight) inflight.abort();
    inflight = new AbortController();
    showList([], "Searching…");
    try {
      const r = await fetch(`../suggest?q=${encodeURIComponent(q)}`, {signal: inflight.signal});
      const body = await r.json();
      if (!r.ok) throw new Error(body.detail || r.statusText);
      body.length ? showList(body) : showList([], "No Maryland matches — keep typing, or press Enter for an exact lookup");
    } catch (e) {
      if (e.name !== "AbortError") showList([], `Suggestions unavailable (${e.message}). Press Enter to search the exact address.`);
    }
  }, 250);
});

addr.addEventListener("keydown", e => {
  if (list.hidden) return;
  if (e.key === "ArrowDown") { e.preventDefault(); setActive(active + 1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); setActive(active - 1); }
  else if (e.key === "Escape") { hideList(); }
});
// mousedown, not click: click fires after the field's blur has already hidden the list.
list.addEventListener("mousedown", e => {
  const li = e.target.closest("li[data-i]");
  if (!li) return;
  e.preventDefault();
  choose(suggestions[+li.dataset.i]);
});
addr.addEventListener("blur", () => setTimeout(hideList, 120));

form.addEventListener("submit", ev => {
  ev.preventDefault();
  if (suggestions.length) choose(suggestions[Math.max(active, 0)]);
  else if (addr.value.trim()) search({address: addr.value.trim()});
});

function choose(sug) {
  addr.value = sug.label;
  hideList();
  const q = {lat: sug.lat, lon: sug.lon, label: sug.label};
  if (sug.osm_type && sug.osm_id) Object.assign(q, {osm_type: sug.osm_type, osm_id: sug.osm_id});
  search(q);
}

const PIN = L.divIcon({className: "pin", iconSize: [30, 42], iconAnchor: [15, 41], html:
  `<svg width="30" height="42" viewBox="0 0 30 42"><path d="M15 1C7.3 1 1 7.2 1 14.9 1 25.3 15 41 15 41s14-15.7 14-26.1C29 7.2 22.7 1 15 1z"
     fill="#c1440e" stroke="#fff" stroke-width="2"/><circle cx="15" cy="15" r="5.5" fill="#fff"/></svg>`});

async function search(params) {
  const btn = form.querySelector("button");
  btn.disabled = true; btn.textContent = "…";
  try {
    const r = await fetch(`../lookup?${new URLSearchParams(params)}`);
    const body = await r.json();
    if (!r.ok) throw new Error(body.detail || r.statusText);

    const {location, equity, building} = body;
    const geoid = location.geoid;
    // Switch counties if the address is outside the one on screen, then select its tract.
    if (geoid.slice(0, 5) !== sel.value) { sel.value = geoid.slice(0, 5); await load(); }

    let target = null;
    layer.eachLayer(l => { if (l.feature.properties.geoid === geoid) target = l; });
    if (selected) layer.resetStyle(selected);
    selected = target;
    renderPanel(target ? target.feature.properties : equity);

    // Pin the exact point and outline the rooftop, then fly in on satellite to show it.
    if (pin) map.removeLayer(pin);
    if (roof) map.removeLayer(roof);
    pin = L.marker([location.lat, location.lon], {icon: PIN, zIndexOffset: 1000})
      .bindTooltip(esc(location.matched_address), {direction: "top", offset: [0, -38]}).addTo(map);
    roof = building ? L.geoJSON(building, {interactive: false, style: {color: "#ffd400", weight: 3,
      fillColor: "#ffd400", fillOpacity: 0.35}}).addTo(map) : null;
    if (!map.hasLayer(satellite)) { map.removeLayer(streets); satellite.addTo(map); }
    if (roof) map.fitBounds(roof.getBounds(), {maxZoom: 19, padding: [120, 120], animate: false});
    else map.setView([location.lat, location.lon], 18, {animate: false});
    if (target) { highlight(target); target.bringToBack(); }

    document.getElementById("panel").insertAdjacentHTML("afterbegin",
      `<div class="addr-card"><b>${esc(location.matched_address)}</b>${building
        ? "Rooftop outlined in yellow (building footprint from OpenStreetMap)."
        : "Pinned on the map. OpenStreetMap has no footprint for this building."}
        <div class="sub">${esc(location.tract_name || "")} · tract ${esc(geoid)}</div></div>`);
  } catch (e) {
    flashPanel(`<p class="empty" style="color:var(--hi)">${esc(e.message)}</p>`);
  } finally {
    btn.disabled = false; btn.textContent = "Find";
  }
}

load();
</script>
</body>
</html>
