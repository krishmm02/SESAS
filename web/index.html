<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SESAS — Solar Equity &amp; Siting, Maryland</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --ink:#15202b; --ink-mid:#4a5968; --ink-soft:#7a8795;
    --line:#dde3ea; --panel:#ffffff; --ground:#f4f6f9;
    --hi:#b2182b; --mid:#ef8a62; --neutral:#f7f7f7; --lo:#67a9cf; --lolo:#2166ac;
    --accent:#c1440e;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:var(--font);color:var(--ink);background:var(--ground);display:flex;flex-direction:column}

  header{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 18px;
         display:flex;align-items:center;gap:22px;flex-wrap:wrap;z-index:1000}
  h1{font-size:15px;font-weight:650;margin:0;letter-spacing:-.01em;white-space:nowrap}
  h1 span{color:var(--ink-soft);font-weight:400}
  select{font-family:var(--font);font-size:13px;padding:5px 9px;border:1px solid var(--line);
         border-radius:5px;background:#fff;color:var(--ink);min-width:190px}
  label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);
        margin-right:7px;font-weight:600}
  #search{display:flex;align-items:center;gap:0}
  #addr{font-family:var(--font);font-size:13px;padding:5px 9px;border:1px solid var(--line);
        border-radius:5px 0 0 5px;width:236px;color:var(--ink)}
  #addr:focus{outline:2px solid var(--accent);outline-offset:-1px}
  #search button{font-family:var(--font);font-size:12px;font-weight:600;padding:6px 12px;
    border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;
    border-radius:0 5px 5px 0}
  #search button:disabled{opacity:.55;cursor:default}
  #tiers{display:flex;gap:7px;margin-left:auto;flex-wrap:wrap}
  .chip{font-size:11px;font-family:var(--mono);padding:4px 9px;border-radius:11px;
        border:1px solid var(--line);background:#fff;white-space:nowrap}
  .chip b{font-weight:650}
  .chip.HIGH{background:#fdecea;border-color:#f3c0b9;color:var(--hi)}
  .chip.MEDIUM{background:#fef4ec;border-color:#f6d9c2;color:#9a4f12}
  .chip.LOW{background:#eef4fa;border-color:#cfe0ef;color:#2166ac}
  .layers{display:flex;gap:14px;font-size:13px}
  .layers label{text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink);
                font-weight:500;margin:0;cursor:pointer}

  main{flex:1;display:flex;min-height:0}
  #map{flex:1;min-width:0;background:var(--ground)}
  aside{width:312px;flex:none;background:var(--panel);border-left:1px solid var(--line);
        overflow-y:auto;padding:16px 18px}

  .empty{color:var(--ink-soft);font-size:13px;line-height:1.55;margin-top:6px}
  .geoid{font-family:var(--mono);font-size:12px;color:var(--ink-soft);margin:0 0 3px}
  .tier{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;
        padding:3px 9px;border-radius:4px;margin-bottom:14px}
  .tier.HIGH{background:#fdecea;color:var(--hi)}
  .tier.MEDIUM{background:#fef4ec;color:#9a4f12}
  .tier.LOW{background:#eef4fa;color:#2166ac}
  .tier.NONE{background:#f0f2f5;color:var(--ink-soft)}
  .tier.SITE{background:#e7f4e4;color:#1b7837}

  .pair{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
        padding:9px 0;border-bottom:1px solid var(--line)}
  .pair:last-child{border-bottom:0}
  .pair dt{font-size:12px;color:var(--ink-mid)}
  .pair dd{margin:0;font-family:var(--mono);font-size:13px;font-weight:600;
           font-variant-numeric:tabular-nums}
  dl{margin:0}
  .big{font-size:26px;font-weight:650;font-family:var(--mono);line-height:1.1;
       font-variant-numeric:tabular-nums}
  .big.pos{color:var(--hi)} .big.neg{color:var(--lolo)}
  .sub{font-size:11px;color:var(--ink-soft);margin-top:3px;line-height:1.45}
  h2{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-soft);
     margin:20px 0 7px;font-weight:650}
  .note{font-size:11px;color:var(--ink-soft);line-height:1.5;margin-top:14px;
        padding-top:12px;border-top:1px solid var(--line)}

  .legend{background:#fff;padding:9px 11px;border-radius:6px;border:1px solid var(--line);
          font-size:11px;line-height:1.7;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .legend i{width:15px;height:11px;float:left;margin:3px 7px 0 0;border-radius:2px}
  .legend .t{font-weight:650;margin-bottom:5px;font-size:10px;text-transform:uppercase;
             letter-spacing:.05em;color:var(--ink-soft)}
  .leaflet-container{font-family:var(--font)}
  #status{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:900;
          background:#fff;border:1px solid var(--line);border-radius:7px;padding:14px 20px;
          font-size:13px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
  #status.err{border-color:#f3c0b9;background:#fdecea;color:var(--hi);max-width:420px}
</style>
</head>
<body>

<header>
  <h1>Solar Equity &amp; Siting <span>· Maryland</span></h1>
  <div><label for="county">County</label><select id="county"></select></div>
  <form id="search"><label for="addr">Address</label><input id="addr" type="text"
    placeholder="5200 Park Heights Ave, Baltimore MD" autocomplete="off"><button>Find</button></form>
  <div class="layers">
    <label><input type="checkbox" id="show-equity" checked> Rooftop equity (tracts)</label>
    <label><input type="checkbox" id="show-grid"> Utility-scale siting (1 km)</label>
  </div>
  <div id="tiers"></div>
</header>

<main>
  <div id="map"><div id="status">Loading tracts…</div></div>
  <aside>
    <div id="panel">
      <h2>Detail</h2>
      <p class="empty">Click a tract to see its expected versus actual adoption, the
         structural factors driving its gap, and what a rooftop system would cost there.
         Turn on the siting layer and click a 1 km cell to see why it scores as a solar
         farm site.</p>
    </div>
  </aside>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const COUNTIES = {
  "":"All Maryland","24001":"Allegany","24003":"Anne Arundel","24005":"Baltimore County",
  "24009":"Calvert","24011":"Caroline","24013":"Carroll","24015":"Cecil","24017":"Charles",
  "24019":"Dorchester","24021":"Frederick","24023":"Garrett","24025":"Harford","24027":"Howard",
  "24029":"Kent","24031":"Montgomery","24033":"Prince George's","24035":"Queen Anne's",
  "24037":"St. Mary's","24039":"Somerset","24041":"Talbot","24043":"Washington",
  "24045":"Wicomico","24047":"Worcester","24510":"Baltimore City"
};

const LABELS = {
  pct_minority:"Minority share", median_household_income:"Median income",
  median_home_value:"Median home value", single_family_detached_rate:"Detached homes",
  owner_rate:"Owner-occupancy", pop_density_km2:"Population density",
  low_income_share:"Low-income share", energy_burden:"Energy burden",
  poverty_rate:"Poverty rate", renter_share:"Renter share", median_year_built:"Housing vintage",
  slope_mean_deg:"slope", flat_frac:"flat land share", south_facing_frac:"south-facing share",
  elev_mean_m:"elevation", elev_range_m:"terrain relief", lc_tree_frac:"forest cover",
  lc_grass_frac:"grassland", lc_crop_frac:"cropland", lc_water_frac:"water",
  lc_wetland_frac:"wetland", dist_line_km:"distance to power line",
  dist_substation_km:"distance to substation"
};

// Colour by priority tier, not by raw gap. Tiers come from the statewide gap percentile, so
// a tract can sit in the HIGH tier on a gap of +2.25 - which on a raw-gap scale spanning
// -19 to +10 renders as the palest possible fill. Keying the map to the tier keeps the
// fill, the legend and the detail badge all saying the same thing.
const TIER_COLORS = {HIGH:"#b2182b", MEDIUM:"#ef8a62", LOW:"#4393c3"};
const colorFor = t => TIER_COLORS[t] || "#d9dee4";

const map = L.map("map", {zoomControl:true}).setView([39.03, -76.8], 8);
// Plain OSM tiles: CARTO's basemaps started demanding an API key, and a course project
// should not carry a credential just to draw a background.
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution:'&copy; OpenStreetMap contributors', maxZoom:19, opacity:0.55
}).addTo(map);

// Siting uses a separate green scale so the two layers never read as the same measure.
const GRID_COLORS = {HIGH:"#1b7837", MEDIUM:"#7fbf7b", LOW:"#d9f0d3", EXCLUDED:"#c9ced6"};
const legendRows = rows => rows.map(([c,t]) => `<i style="background:${c}"></i>${t}<br>`).join("");
const EQUITY_LEGEND = '<div class="t">Rooftop intervention priority</div>' + legendRows([
  ["#b2182b","High — top quartile gap"], ["#ef8a62","Medium"],
  ["#4393c3","Low — at or above expectation"], ["#d9dee4","Not scored"]]);
const GRID_LEGEND = '<div class="t" style="margin-top:6px">Solar farm siting (1 km)</div>' + legendRows([
  ["#1b7837","High — top 5% of cells"], ["#7fbf7b","Medium — next 20%"], ["#d9f0d3","Low"],
  ["#c9ced6","Developed land — excluded"]]) +
  '<i style="background:none;border:2px solid #15202b"></i>Existing farm<br>';

const legend = L.control({position:"bottomright"});
legend.onAdd = () => L.DomUtil.create("div","legend");
legend.addTo(map);
function renderLegend() {
  const el = legend.getContainer();
  el.innerHTML = (showEquity.checked ? EQUITY_LEGEND : "") + (showGrid.checked ? GRID_LEGEND : "");
  el.style.display = showEquity.checked || showGrid.checked ? "" : "none";
}

const sel = document.getElementById("county");
Object.entries(COUNTIES).forEach(([v,n]) => sel.add(new Option(n, v)));
sel.value = "24510";
const showEquity = document.getElementById("show-equity");
const showGrid = document.getElementById("show-grid");

let layer = null, gridLayer = null, selected = null;
// Each load takes a ticket; a response whose ticket is no longer current is dropped, so a
// slow earlier request (say, the previous county) can never draw over a newer one.
let equityTicket = 0, gridTicket = 0;

const fmt = (v, d=2) => v == null ? "—" : Number(v).toFixed(d);

function setStatus(msg, isErr) {
  const old = document.getElementById("status");
  if (old) old.remove();
  if (!msg) return;
  const el = document.createElement("div");
  el.id = "status"; el.textContent = msg;
  if (isErr) el.className = "err";
  document.getElementById("map").appendChild(el);
}

function renderTiers(features) {
  const counts = {HIGH:0, MEDIUM:0, LOW:0};
  features.forEach(f => { const t = f.properties.priority_tier; if (t in counts) counts[t]++; });
  document.getElementById("tiers").innerHTML = Object.entries(counts)
    .map(([t,n]) => `<span class="chip ${t}">${t} <b>${n}</b></span>`).join("")
    + `<span class="chip">${features.length} tracts</span>`;
}

// Only factors with a positive SHAP are stored, so anything present here widens the gap.
function factorRows(p) {
  const rows = [1,2,3]
    .map(i => [p[`barrier_${i}`], p[`barrier_${i}_shap`]])
    .filter(([n, v]) => n && v != null)
    .map(([n, v]) => `<div class="pair"><dt>${LABELS[n] || n}</dt><dd>+${fmt(v)}</dd></div>`);
  return rows.length ? rows.join("")
    : `<div class="pair"><dt>No factor widens this gap</dt><dd>—</dd></div>`;
}

function renderPanel(p) {
  const tier = p.priority_tier || "NONE";
  const gap = p.gap;
  document.getElementById("panel").innerHTML = `
    <h2>Tract detail</h2>
    <p class="geoid">${p.geoid}</p>
    <span class="tier ${tier}">${tier === "NONE" ? "NOT SCORED" : tier + " PRIORITY"}</span>
    <div class="big ${gap > 0 ? "pos" : "neg"}">${gap == null ? "—" : (gap > 0 ? "+" : "") + fmt(gap)}</div>
    <div class="sub">gap in residential systems per 1,000 households${
      gap > 0 ? " — fewer than its sunlight supports" : gap < 0 ? " — more than expected" : ""}</div>
    <h2>Components</h2>
    <dl>
      <div class="pair"><dt>Expected adoption</dt><dd>${fmt(p.expected_adoption)}</dd></div>
      <div class="pair"><dt>Actual adoption</dt><dd>${fmt(p.actual_adoption)}</dd></div>
      <div class="pair"><dt>Gap percentile</dt><dd>${p.gap_percentile == null ? "—" :
        (p.gap_percentile*100).toFixed(0) + "%"}</dd></div>
    </dl>
    <h2>What widens this gap</h2>
    <dl>${factorRows(p)}</dl>
    <div class="sub" style="margin-top:6px">SHAP contributions, largest first. These
      factors are collinear — income, poverty and minority share move together — so three
      are listed rather than one.</div>
    <h2>Rooftop economics</h2>
    <dl id="roi"><div class="pair"><dt>Loading…</dt><dd></dd></div></dl>
    <p class="note">Expected and actual are both shown because the gap alone cannot
       distinguish real untapped potential from a poor expectation. Adoption is DeepSolar's
       2016 baseline.</p>`;
  loadRoi(p.geoid);
}

// ROIService composes YieldService and SocioEconService; reached through the gateway.
async function loadRoi(geoid) {
  const el = document.getElementById("roi");
  try {
    const r = await fetch(`../roi/${geoid}`);
    if (!r.ok) throw new Error((await r.json()).detail || r.status);
    const x = await r.json();
    if (x.error) throw new Error(x.error);
    if (el !== document.getElementById("roi")) return;  // user clicked elsewhere meanwhile
    const pct = v => v == null ? "—" : (v * 100).toFixed(0) + "%";
    const usd = v => "$" + Number(v).toLocaleString();
    el.innerHTML = [
      ["System sized to household use", `${fmt(x.system_kw, 1)} kW`],
      ["Annual output", `${Number(x.annual_kwh).toLocaleString()} kWh`],
      ["Installed cost", usd(x.net_cost)],
      ["Annual bill savings", usd(x.annual_savings)],
      ["Simple payback", `${fmt(x.simple_payback_years, 1)} yr`],
      ["Cost as share of median income", pct(x.net_cost_share_of_income)],
    ].map(([k, v]) => `<div class="pair"><dt>${k}</dt><dd>${v}</dd></div>`).join("") +
      `<div class="sub" style="margin-top:6px">No federal credit (ended 2025). Payback is
       near-identical statewide because sunlight is; the upfront cost against income is not.</div>`;
  } catch (e) {
    el.innerHTML = `<div class="sub">Unavailable (${e.message}). Open the dashboard through
      the gateway on port 8000, with Yield and ROI services running.</div>`;
  }
}

// Drivers arrive as "low dist_substation_km" - direction, then feature name.
function renderCell(p) {
  const tier = p.tier || "NONE";
  const drivers = [1,2,3].filter(i => p[`driver_${i}`]).map(i => {
    const [dir, name] = p[`driver_${i}`].split(" ");
    return `<div class="pair"><dt>${dir === "low" ? "Low" : "High"} ${LABELS[name] || name}</dt>
            <dd>+${fmt(p[`driver_${i}_shap`])}</dd></div>`;
  });
  const excluded = tier === "EXCLUDED";
  document.getElementById("panel").innerHTML = `
    <h2>1 km cell</h2>
    <p class="geoid">cell ${p.cell_id}${p.county ? " · " + (COUNTIES[p.county] || p.county) : ""}</p>
    <span class="tier ${excluded ? "NONE" : "SITE"}">${excluded ? "EXCLUDED — DEVELOPED LAND" : tier + " SITING SCORE"}</span>
    ${excluded ? '<div class="sub">At least 40% built-up, so not scored as a solar farm site.</div>' :
      `<div class="big">${(p.score_percentile * 100).toFixed(0)}<span style="font-size:15px">th percentile</span></div>
       <div class="sub">among undeveloped Maryland land cells</div>`}
    <h2>Why it scores this way</h2>
    <dl>${drivers.join("") || '<div class="pair"><dt>No factor raises this cell</dt><dd>—</dd></div>'}</dl>
    <h2>Existing solar</h2>
    <dl><div class="pair"><dt>Farm already here</dt><dd>${p.has_pv ? "Yes, since " + p.pv_first_year : "No"}</dd></div></dl>
    <p class="note">Learned from where Maryland's existing farms were built (USPVDB). It beats
       "nearest substation" and "most sunlight" baselines under spatial cross-validation;
       sunlight alone does worse than chance. Land-cover classes that can see existing panels
       are excluded.</p>`;
}

function style(f) {
  return {fillColor: colorFor(f.properties.priority_tier), weight: 0.5, color: "#ffffff",
          fillOpacity: 0.72, opacity: 1};
}

async function load() {
  renderLegend();
  await Promise.all([loadEquity(), loadGrid()]);
}

async function loadGrid() {
  const ticket = ++gridTicket;
  if (gridLayer) { map.removeLayer(gridLayer); gridLayer = null; }
  if (!showGrid.checked) return;
  const q = sel.value ? `?county=${sel.value}` : "";  // statewide defaults to HIGH cells only
  try {
    const r = await fetch(`../geojson/developability${q}`);
    if (!r.ok) throw new Error(`${r.status} ${(await r.json()).detail || r.statusText}`);
    const gj = await r.json();
    if (ticket !== gridTicket) return;
    gridLayer = L.geoJSON(gj, {
      style: f => ({fillColor: GRID_COLORS[f.properties.tier] || "#eeeeee", fillOpacity: showEquity.checked ? 0.45 : 0.8,  // let tracts show through
                    weight: f.properties.has_pv ? 2 : 0.3,
                    color: f.properties.has_pv ? "#15202b" : "#ffffff"}),
      onEachFeature: (f, lyr) => {
        lyr.bindTooltip(`cell ${f.properties.cell_id}<br>${f.properties.tier} siting`, {sticky:true});
        lyr.on("click", () => renderCell(f.properties));
      }
    }).addTo(map);
    if (!layer) {  // the tract layer, when shown, owns the view
      map.invalidateSize();
      map.fitBounds(gridLayer.getBounds(), {padding:[18,18], animate:false});
    }
  } catch (e) {
    if (ticket !== gridTicket) return;
    setStatus(`Could not load siting cells: ${e.message}. Is DevelopabilityService running on 8009?`, true);
  }
}

async function loadEquity() {
  const ticket = ++equityTicket;
  if (layer) { map.removeLayer(layer); layer = null; }
  document.getElementById("tiers").innerHTML = "";
  if (!showEquity.checked) return;
  setStatus("Loading tracts…");
  const q = sel.value ? `?county=${sel.value}` : "";
  try {
    const r = await fetch(`../geojson/equity${q}`);
    if (!r.ok) throw new Error(`${r.status} ${(await r.json()).detail || r.statusText}`);
    const gj = await r.json();
    if (ticket !== equityTicket) return;
    if (!gj.features.length) { setStatus("No scored tracts here.", true); return; }

    layer = L.geoJSON(gj, {
      style,
      onEachFeature: (f, lyr) => {
        lyr.bindTooltip(`${f.properties.geoid}<br>gap ${fmt(f.properties.gap)}`, {sticky:true});
        lyr.on({
          mouseover: e => e.target.setStyle({weight:2, color:"#15202b"}),
          mouseout:  e => { if (e.target !== selected) layer.resetStyle(e.target); },
          click: e => {
            if (selected) layer.resetStyle(selected);
            selected = e.target;
            e.target.setStyle({weight:2.5, color:"#15202b"}); e.target.bringToFront();
            renderPanel(f.properties);
          }
        });
      }
    }).addTo(map);
    if (gridLayer) gridLayer.bringToFront();

    // The map lives in a flex column, so Leaflet can still be holding a stale container
    // size when this fetch resolves. Without the re-measure, fitBounds reads a near-zero
    // height, snaps to max zoom, and every polygon renders as the degenerate path "M0 0".
    map.invalidateSize();
    map.fitBounds(layer.getBounds(), {padding:[18,18], animate:false});
    renderTiers(gj.features);
    setStatus(null);
  } catch (e) {
    if (ticket !== equityTicket) return;
    setStatus(`Could not load tracts: ${e.message}. Is EquityGapService running on 8005?`, true);
    document.getElementById("tiers").innerHTML = "";
  }
}

sel.addEventListener("change", load);
showEquity.addEventListener("change", () => {
  renderLegend(); loadEquity();
  if (gridLayer) gridLayer.resetStyle();  // re-applies opacity for the new layer combination
});
showGrid.addEventListener("change", () => { renderLegend(); loadGrid(); });

// Address search. /lookup chains GeocodingService then EquityGapService, so one call
// takes a street address all the way to a scored tract.
const form = document.getElementById("search");
const addr = document.getElementById("addr");

function flashPanel(html) {
  document.getElementById("panel").innerHTML = `<h2>Tract detail</h2>${html}`;
}

form.addEventListener("submit", async ev => {
  ev.preventDefault();
  const q = addr.value.trim();
  if (!q) return;
  const btn = form.querySelector("button");
  btn.disabled = true; btn.textContent = "…";
  try {
    const r = await fetch(`../lookup?address=${encodeURIComponent(q)}`);
    const body = await r.json();
    if (!r.ok) throw new Error(body.detail || r.statusText);

    const geoid = body.location.geoid;
    // Switch counties if the address is outside the one on screen, then select its tract.
    const county = geoid.slice(0, 5);
    // The result is a tract, so the tract layer must be on to select it.
    const turnOn = !showEquity.checked;
    if (turnOn) { showEquity.checked = true; renderLegend(); }
    if (county !== sel.value) { sel.value = county; await load(); }
    else if (turnOn) await loadEquity();

    let target = null;
    layer.eachLayer(l => { if (l.feature.properties.geoid === geoid) target = l; });
    if (target) {
      if (selected) layer.resetStyle(selected);
      selected = target;
      target.setStyle({weight:2.5, color:"#15202b"}); target.bringToFront();
      map.fitBounds(target.getBounds(), {padding:[90,90], maxZoom:14, animate:false});
      renderPanel(target.feature.properties);
    } else {
      renderPanel(body.equity);
    }
    const p = document.getElementById("panel");
    p.insertAdjacentHTML("afterbegin",
      `<p class="geoid" style="margin-bottom:10px">matched: ${body.location.matched_address}</p>`);
  } catch (e) {
    flashPanel(`<p class="empty" style="color:var(--hi)">${e.message}</p>`);
  } finally {
    btn.disabled = false; btn.textContent = "Find";
  }
});

load();
</script>
</body>
</html>
